<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First-Time Owner Setup | Sai Srinivasa Automobiles | Madhira</title>
    <meta name="description" content="Initial Owner Account Setup for Sai Srinivasa Automobiles Management Console.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-login">

    <!-- HEADER BAR -->
    <header class="owner-header">
        <div class="owner-header-left">
            <a href="index.html" class="btn-back-website" title="Return to public website">
                <i class="fa-solid fa-arrow-left"></i> <span>Back to Website</span>
            </a>

            <div class="owner-brand-group">
                <a href="index.html" class="owner-brand-title">
                    <span class="text-red">SAI SRINIVASA</span> <span class="text-white">AUTOMOBILES</span>
                </a>
                <span class="badge-owner-console">FIRST-TIME OWNER SETUP</span>
            </div>
        </div>
    </header>

    <!-- SETUP CONTAINER -->
    <div class="login-page-container">
        <div class="login-card-standalone" style="max-width: 520px;">
            <div class="login-card-header text-center">
                <div class="login-icon-circle">
                    <i class="fa-solid fa-user-gear"></i>
                </div>
                <h1 class="login-title">First-Time Owner Setup</h1>
                <p class="login-subtitle">Create the master owner account for Sai Srinivasa Automobiles.</p>
            </div>

            <div id="setupAlertMsg" class="login-error-msg hidden"></div>

            <form id="ownerSetupForm" onsubmit="handleFirstTimeSetupSubmit(event)" class="login-form">
                <div class="form-group mb-15">
                    <label for="setupName">OWNER FULL NAME *</label>
                    <input type="text" id="setupName" required placeholder="e.g. RamBabu">
                </div>

                <div class="form-group mb-15">
                    <label for="setupUsername">USERNAME *</label>
                    <input type="text" id="setupUsername" required autocomplete="username" placeholder="e.g. rambabu">
                </div>

                <div class="form-group mb-15">
                    <label for="setupEmail">EMAIL ADDRESS</label>
                    <input type="email" id="setupEmail" placeholder="rambabu@saisrinivasa.com">
                </div>

                <div class="form-group mb-15">
                    <label for="setupPassword">PASSWORD * (MIN 8 CHARACTERS)</label>
                    <input type="password" id="setupPassword" required autocomplete="new-password" placeholder="••••••••">
                </div>

                <div class="form-group mb-25">
                    <label for="setupConfirmPassword">CONFIRM PASSWORD *</label>
                    <input type="password" id="setupConfirmPassword" required autocomplete="new-password" placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-red btn-block btn-lg btn-pill-lg" id="btnSubmitSetup">
                    <i class="fa-solid fa-user-check"></i> <span>Create Master Owner Account</span>
                </button>
            </form>

            <div id="loginRedirectBtnWrap" class="mt-20 text-center hidden">
                <a href="login.html" class="btn btn-red btn-block btn-pill-lg" style="text-decoration: none;">
                    <i class="fa-solid fa-right-to-bracket"></i> Go to Owner Login &rarr;
                </a>
            </div>

            <div class="login-footer-info">
                <p><i class="fa-solid fa-shield-halved"></i> Secured Setup • Credentials stored in SQL Server as bcrypt hash.</p>
            </div>
        </div>
    </div>

    <!-- Custom JS -->
    <script src="script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const res = await fetch("/api/auth/setup-status");
                if (!res.ok) {
                    throw new Error(`Server returned HTTP ${res.status}`);
                }
                const data = await res.json();

                if (data.ownerExists && !data.setupRequired) {
                    const alertEl = document.getElementById("setupAlertMsg");
                    if (alertEl) {
                        alertEl.style.background = "rgba(34, 197, 94, 0.15)";
                        alertEl.style.borderColor = "#22c55e";
                        alertEl.style.color = "#86efac";
                        alertEl.textContent = "An owner account already exists in SQL Server. Redirecting to login page...";
                        alertEl.classList.remove("hidden");
                    }
                    const formEl = document.getElementById("ownerSetupForm");
                    if (formEl) formEl.style.display = "none";
                    const redirectWrap = document.getElementById("loginRedirectBtnWrap");
                    if (redirectWrap) redirectWrap.classList.remove("hidden");

                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 2500);
                }
            } catch (err) {
                console.warn("Setup status check error:", err);
                const alertEl = document.getElementById("setupAlertMsg");
                if (alertEl) {
                    alertEl.style.background = "rgba(239, 68, 68, 0.15)";
                    alertEl.style.borderColor = "#ef4444";
                    alertEl.style.color = "#fca5a5";
                    alertEl.textContent = "Could not connect to Express server at http://localhost:5000. Please start the server using 'node server.js'.";
                    alertEl.classList.remove("hidden");
                }
            }
        });

        async function handleFirstTimeSetupSubmit(event) {
            event.preventDefault();
            const alertEl = document.getElementById("setupAlertMsg");
            alertEl.classList.add("hidden");

            const name = document.getElementById("setupName").value.trim();
            const username = document.getElementById("setupUsername").value.trim();
            const email = document.getElementById("setupEmail").value.trim();
            const password = document.getElementById("setupPassword").value;
            const confirmPassword = document.getElementById("setupConfirmPassword").value;

            if (!username || !password) {
                alertEl.textContent = "Username and password are required.";
                alertEl.classList.remove("hidden");
                return;
            }

            if (password !== confirmPassword) {
                alertEl.textContent = "Password and Confirm Password do not match.";
                alertEl.classList.remove("hidden");
                return;
            }

            if (password.length < 8) {
                alertEl.textContent = "Password must be at least 8 characters long.";
                alertEl.classList.remove("hidden");
                return;
            }

            const btnSubmit = document.getElementById("btnSubmitSetup");
            if (btnSubmit) btnSubmit.disabled = true;

            try {
                const res = await fetch("/api/auth/setup", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, username, email, password, confirmPassword })
                });

                let data = {};
                try {
                    data = await res.json();
                } catch (e) {
                    data = { error: "Server response error." };
                }

                if (res.ok && data.success) {
                    alertEl.style.background = "rgba(34, 197, 94, 0.15)";
                    alertEl.style.borderColor = "#22c55e";
                    alertEl.style.color = "#86efac";
                    alertEl.textContent = data.message || "Owner account created successfully! Redirecting to login...";
                    alertEl.classList.remove("hidden");
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1500);
                } else {
                    alertEl.style.background = "rgba(239, 68, 68, 0.15)";
                    alertEl.style.borderColor = "#ef4444";
                    alertEl.style.color = "#fca5a5";
                    alertEl.textContent = data.error || `Setup failed (HTTP ${res.status}). Please try again.`;
                    alertEl.classList.remove("hidden");
                    if (btnSubmit) btnSubmit.disabled = false;
                }
            } catch (err) {
                alertEl.style.background = "rgba(239, 68, 68, 0.15)";
                alertEl.style.borderColor = "#ef4444";
                alertEl.style.color = "#fca5a5";
                alertEl.textContent = "Server connection error. Make sure 'node server.js' is running on http://localhost:5000.";
                alertEl.classList.remove("hidden");
                if (btnSubmit) btnSubmit.disabled = false;
            }
        }
    </script>
</body>
</html>
